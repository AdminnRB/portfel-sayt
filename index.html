<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rəşid Bağırov | Portfel v2</title>
    <style>
        /* CSS Reset & Baza Prinsipləri */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            scroll-behavior: smooth;
            width: 100%;
            /* Ekrandan kənara çıxan hər şeyi gizlədir və sağa-sola sürüşməni tamamilə kəsir */
            overflow-x: hidden; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19; /* Tünd göy / Kosmik fon */
            color: #f3f4f6;
            line-height: 1.6;
        }

        /* Naviqasiya Paneli */
        header {
            width: 100%;
            padding: 20px 16px; /* Mobildə sıxılmasın deyə padding azaldıldı */
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background-color: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.15rem; /* Mobildə adın sığması üçün bir az kiçildildi */
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .logo span {
            color: #10b981; /* Neon yaşıl vurğu */
        }

        nav {
            display: none;
        }

        nav a {
            color: #9ca3af;
            text-decoration: none;
            margin-left: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #10b981;
        }

        .lang-switch {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0; /* Dil panelinin əzilməsinin qarşısını alır */
        }

        .lang-item {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .lang-item.active {
            color: #ffffff;
            border-bottom: 2px solid #10b981;
            padding-bottom: 2px;
        }

        /* Hero Bölməsi */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 16px 80px 16px;
            position: relative;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; /* Mobildə daşmasın deyə % edildi */
            max-width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.06) 0%, rgba(11, 15, 25, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .hero-container {
            max-width: 700px;
            width: 100%;
            z-index: 1;
        }

        .profile-title {
            font-size: 2.3rem; /* Mobildə ekrana sığması üçün kiçildildi */
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 12px;
            animation: fadeInUp 0.8s ease forwards;
        }

        .profile-subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: 28px;
            animation: fadeInUp 0.8s ease forwards 0.1s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .profile-subtitle span {
            color: #10b981;
        }

        .profile-description {
            font-size: 0.95rem;
            color: #d1d5db;
            margin-bottom: 40px;
            line-height: 1.7;
            animation: fadeInUp 0.8s ease forwards 0.2s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            animation: fadeInUp 0.8s ease forwards 0.3s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .btn {
            display: inline-block;
            padding: 16px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background-color: #ffffff;
            color: #0b0f19;
            border: 1px solid #ffffff;
        }

        .btn-primary:hover {
            background-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-secondary {
            background-color: rgba(156, 163, 175, 0.08);
            color: #f3f4f6;
            border: 1px solid rgba(156, 163, 175, 0.2);
        }

        .btn-secondary:hover {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
            color: #10b981;
        }

        /* "Mən Kiməm?" (Haqqımda) Bölməsi */
        .about-section {
            padding: 60px 16px;
            max-width: 800px;
            margin: 0 16px; /* Kənarlardan sıxılmasın */
            background-color: rgba(20, 27, 45, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
        }

        @media (min-width: 832px) {
            .about-section { margin: 0 auto; }
        }

        .about-content p {
            font-size: 1rem;
            color: #d1d5db;
            margin-bottom: 20px;
            text-align: center;
        }

        .about-content strong {
            color: #10b981;
        }

        .skills-container {
            margin-top: 35px;
        }

        .skills-title {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: 600;
            border-left: 3px solid #10b981;
            padding-left: 10px;
        }

        .skills-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skills-list li {
            font-size: 0.95rem;
            color: #9ca3af;
            background-color: rgba(11, 15, 25, 0.6);
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            word-break: break-word; /* Mobildə yazının daşmasını kəsir */
        }

        .skills-list strong {
            color: #ffffff;
            display: block; /* Mobildə alt-alta düşüb təmiz görünsün */
            margin-bottom: 4px;
        }

        @media (min-width: 480px) {
            .skills-list strong {
                display: inline-block;
                min-width: 140px;
                margin-bottom: 0;
            }
        }

        /* Layihələr Bölməsi */
        .projects-section {
            padding: 80px 16px;
            max-width: 1140px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .section-desc {
            color: #9ca3af;
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .projects-grid {
            display: block;
        }

        .project-card {
            background-color: rgba(20, 27, 45, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .project-image-wrapper {
            width: 100%;
            height: 200px;
            background-color: #141b2d;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .project-image-wrapper svg {
            width: 100%;
            height: 100%;
            object-fit: cover; /* SVG-lərin ekran ölçüsünə görə tam oturması üçün */
        }

        .project-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-details {
            margin-bottom: 20px;
        }

        .project-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 4px;
            margin-bottom: 14px;
        }

        /* Badge Rəng Çalarları */
        .badge-green { background-color: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge-blue { background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .badge-purple { background-color: rgba(139, 92, 246, 0.1); color: #8b5cf6; }
        .badge-orange { background-color: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .badge-cyan { background-color: rgba(6, 182, 212, 0.1); color: #06b6d4; }
        .badge-rose { background-color: rgba(244, 63, 94, 0.1); color: #f43f5e; }

        .project-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .project-text {
            color: #9ca3af;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .project-critical {
            font-size: 0.85rem;
            color: #e5e7eb;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 2px solid rgba(255, 255, 255, 0.2);
            margin-top: 10px;
        }
        
        .project-card:hover .project-critical {
            border-left-color: #10b981;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .tech-tag {
            font-size: 0.75rem;
            color: #6b7280;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Əlaqə (Contact) Bölməsi */
        .contact-section {
            padding: 60px 16px;
            max-width: 960px;
            margin: 40px auto 0 auto;
        }

        .contact-box {
            background-color: #11141c; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px 20px;
        }

        .contact-box h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .contact-subtitle {
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 30px;
            max-width: 800px;
        }

        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .contact-card {
            background-color: #21242c; 
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 16px 20px;
            text-decoration: none;
            display: block;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .contact-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            background-color: #262932;
        }

        .contact-label {
            font-size: 0.8rem;
            color: #717680;
            margin-bottom: 4px;
            display: block;
        }

        .contact-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: #e5e7eb;
            word-break: break-all; /* Uzun linklərin ekrandan kənara çıxmasını önləyir */
        }

        /* Footer */
        footer {
            padding: 40px 16px;
            text-align: center;
            font-size: 0.8rem;
            color: #4b5563;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 60px;
            line-height: 1.5;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 600px) {
            .cta-group {
                flex-direction: row;
                justify-content: center;
            }
            .btn {
                width: auto;
                min-width: 170px;
            }
        }

        @media (min-width: 768px) {
            header { padding: 24px 48px; }
            nav { display: block; }
            .logo { font-size: 1.25rem; }
            .profile-title { font-size: 3.6rem; }
            .section-title { font-size: 2.4rem; }
            
            .projects-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
            }
            .project-card { margin-bottom: 0; }

            .contact-box { padding: 50px 45px; }
            .contact-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .projects-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">rashid<span>baghirov</span></a>
        <nav>
            <a href="#">Ana Səhifə</a>
            <a href="#haqqimda">Mən Kiməm?</a>
            <a href="#layiheler">Layihələr</a>
            <a href="#">Xidmətlər</a>
            <a href="#elaqe">Əlaqə</a>
        </nav>
